# Cloudflare Tunnel для бэкенда NMNH.
#
# Скопировать в:  C:\Users\Администратор\.cloudflared\config.yml
# и подставить свой TUNNEL-ID (выдаётся командой `cloudflared tunnel create nmnh-api`).
#
# Почему Cloudflare, а не ngrok: у ngrok Free лимит 1 ГБ трафика в месяц
# (ERR_NGROK_725 — именно он положил API). У Cloudflare Tunnel лимита трафика нет,
# адрес постоянный, страницы-предупреждения для браузера тоже нет.

tunnel: ЗАМЕНИ-НА-TUNNEL-ID
credentials-file: C:\Users\Администратор\.cloudflared\ЗАМЕНИ-НА-TUNNEL-ID.json

# Необязательно, но удобно: локальные метрики туннеля.
metrics: 127.0.0.1:20241

ingress:
  # Публичный адрес API → локальный uvicorn на удалённом рабочем столе.
  # Именно 127.0.0.1, а не localhost: на Windows localhost резолвится в IPv6 [::1],
  # а uvicorn с --host 0.0.0.0 слушает только IPv4 → "connection refused".
  - hostname: api.nmnh.trade
    service: http://127.0.0.1:8000
    originRequest:
      # Бэкенд отвечает быстро; таймаут с запасом на медленные вызовы WEEX.
      connectTimeout: 30s
      noTLSVerify: false

  # Снимки и карточки сделок - тот же бэкенд, но отдельным именем.
  #
  # Отдельным потому, что перед этим именем стоит воркер-заслонка
  # (deploy/cloudflare/shots-worker.js): пока сервер выключен, он отвечает
  # вместо Cloudflare с её «Error 1033», которую иначе видит каждый, кому
  # прислали ссылку на график. Держать посредника перед api.nmnh.trade нельзя -
  # туда идёт поток самого терминала.
  #
  # Адрес ссылок задаётся в .env бэкенда: SHOTS_BASE_URL=https://s.nmnh.trade
  - hostname: s.nmnh.trade
    service: http://127.0.0.1:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Обязательное правило-заглушка: всё остальное отбрасываем.
  - service: http_status:404
