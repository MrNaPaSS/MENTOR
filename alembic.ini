# Migracii shemy bazy: docs/architecture/database.md, par. 5.
#
# Tolko latinica: Windows chitaet etot fajl v svoej kodirovke, i russkij tekst
# v utf-8 ronyal zapusk (UnicodeDecodeError) - tak zhe, kak v start.bat.
#
# Adres bazy zdes ne pishem: on v .env (DATABASE_URL), i ego chitaet
# migrations/env.py. Tak parol ne popadaet v repozitorij.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Imena fajlov po poryadku: 0001_baseline.py, 0002_...py - istoriya chitaetsya
# glazami, a ne po sluchajnym nomeram.
file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
